# 每次推送都测试，打 v* 标签时构建 macOS 和 Windows 的安装包。
# macOS 必须在 macOS 上打包（签名和 dmg）；Windows 可以在 Ubuntu 上交叉编译，安装包用 NSIS 制作。
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Generate the TypeScript client
        run: bunx mygo generate
      - name: Typecheck the frontend
        run: bunx tsc --noEmit
      - name: Build the frontend
        run: bun --bun vite build
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  package:
    name: Package (${{ matrix.name }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install NSIS
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis zip
      - name: Build
        run: bunx mygo build -platform ${{ matrix.platform }}
      - name: Package portable Windows archives
        if: matrix.name == 'Windows'
        run: |
          eval "$(bun -e 'import cfg from "./mygo.config.ts"; console.log(`SLUG=${JSON.stringify(cfg.slug || "app")}\nVERSION=${JSON.stringify(cfg.version || "0.1.0")}\nAPP_NAME=${JSON.stringify(cfg.name || "app")}`)')"
          for arch in amd64 arm64; do
            dir="build/windows-$arch"
            exe="$dir/$APP_NAME.exe"
            if [ -f "$exe" ]; then
              zip -j "$dir/${SLUG}-${VERSION}-windows-${arch}-portable.zip" "$exe"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            build/**/*.dmg
            build/**/*-setup-*.exe
            build/**/*-portable.zip

  release:
    name: Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' files < <(find release-assets -type f -print0 | sort -z)
          printf 'Uploading: %s\n' "${files[@]}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" --generate-notes
          fi
