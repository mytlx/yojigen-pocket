# 每次推送都测试，打 v* 标签时构建 macOS 和 Windows 的安装包，以及官方扩展包（zip）。
# macOS 必须在 macOS 上打包（签名和 dmg）；Windows 可以在 Ubuntu 上交叉编译，安装包用 NSIS 制作。
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Generate the TypeScript client
        run: bunx mygo generate
      - name: Typecheck the frontend
        run: bunx tsc --noEmit
      - name: Build the frontend
        run: bun --bun vite build
      - name: Build the extensions
        run: bun run build:ext
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  package:
    name: Package (${{ matrix.name }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    env:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install NSIS
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis zip
      # 可选：用固定的证书给 macOS 版签名，用户更新后不用重新授权系统权限。
      # 需要三个仓库密钥：MACOS_SIGN_P12（证书导出的 .p12，base64）、MACOS_SIGN_PASSWORD、MACOS_SIGN_IDENTITY（证书的名字）。
      # 没配就是 ad-hoc 签名，和以前一样。
      - name: Import the macOS signing certificate
        if: matrix.name == 'macOS' && env.MACOS_SIGN_P12 != ''
        env:
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/sign.keychain-db"
          echo "$MACOS_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p ci "$keychain"
          security import "$RUNNER_TEMP/sign.p12" -P "$MACOS_SIGN_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/sign.p12"
          echo "POCKET_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: Build
        run: bunx mygo build -platform ${{ matrix.platform }}
      - name: Package portable Windows archives
        if: matrix.name == 'Windows'
        run: |
          eval "$(bun -e 'import cfg from "./mygo.config.ts"; console.log(`SLUG=${JSON.stringify(cfg.slug || "app")}\nVERSION=${JSON.stringify(cfg.version || "0.1.0")}\nAPP_NAME=${JSON.stringify(cfg.name || "app")}`)')"
          for arch in amd64 arm64; do
            dir="build/windows-$arch"
            exe="$dir/$APP_NAME.exe"
            if [ -f "$exe" ]; then
              zip -j "$dir/${SLUG}-${VERSION}-windows-${arch}-portable.zip" "$exe"
            fi
          done
      # 扩展包和平台无关，只在一个任务里打，免得发布时出现两份同名文件。
      - name: Build the extension packages
        if: matrix.name == 'Windows'
        run: bun run build:ext
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            build/**/*.dmg
            build/**/*-setup-*.exe
            build/**/*-portable.zip
            build/extensions/*.zip

  release:
    name: Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' files < <(find release-assets -type f -print0 | sort -z)
          printf 'Uploading: %s\n' "${files[@]}"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" --generate-notes
          fi
