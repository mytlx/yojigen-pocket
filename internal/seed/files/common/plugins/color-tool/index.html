<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; font: 14px system-ui, -apple-system, "PingFang SC", "Microsoft YaHei UI", sans-serif; }
  body { margin: 0; padding: 16px; display: grid; grid-template-columns: 148px 1fr; gap: 16px; background: transparent; }
  .swatch { width: 148px; height: 148px; border-radius: 14px; border: 1px solid rgba(128,128,128,.3); overflow: hidden; }
  input[type=color] { width: 180%; height: 180%; margin: -40%; border: 0; padding: 0; background: none; cursor: pointer; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row label { width: 40px; opacity: .65; font-size: 12px; }
  code { flex: 1; padding: 8px 10px; border-radius: 9px; background: rgba(128,128,128,.14); font: 13px ui-monospace, SFMono-Regular, Consolas, monospace; }
  button { padding: 7px 12px; border: 0; border-radius: 9px; background: rgba(128,128,128,.2); color: inherit; font: inherit; cursor: pointer; }
  button:hover { background: rgba(128,128,128,.32); }
  .hint { grid-column: 1 / 3; font-size: 12px; opacity: .6; margin: 0; }
</style>
</head>
<body>
  <div class="swatch"><input id="picker" type="color" value="#2f6bff" /></div>
  <div id="rows"></div>
  <p class="hint">这是一个示例插件：plugins/color-tool。界面就是普通网页，通过 window.pocket 使用剪贴板、通知和存储。</p>
  <script src="/__pocket.js"></script>
  <script>
    const picker = document.getElementById("picker");
    const rows = document.getElementById("rows");
    function hsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
      if (max === min) return `hsl(0, 0%, ${Math.round(l * 100)}%)`;
      const d = max - min, s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      const h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
      return `hsl(${Math.round(h * 60)}, ${Math.round(s * 100)}%, ${Math.round(l * 100)}%)`;
    }
    function render() {
      const hex = picker.value;
      const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
      rows.replaceChildren(...[["HEX", hex], ["RGB", `rgb(${r}, ${g}, ${b})`], ["HSL", hsl(r, g, b)]].map(([label, value]) => {
        const row = document.createElement("div");
        row.className = "row";
        const l = document.createElement("label"); l.textContent = label;
        const c = document.createElement("code"); c.textContent = value;
        const btn = document.createElement("button"); btn.textContent = "复制";
        btn.onclick = async () => { await pocket.copyText(value); btn.textContent = "已复制"; setTimeout(() => (btn.textContent = "复制"), 900); };
        row.append(l, c, btn);
        return row;
      }));
      pocket.setStorage("color", hex);
    }
    picker.addEventListener("input", render);
    pocket.getStorage("color").then((saved) => { if (saved) picker.value = saved; render(); });
  </script>
</body>
</html>
